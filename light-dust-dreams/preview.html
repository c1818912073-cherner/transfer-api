<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>光尘织梦 · Preview</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070e1a;
      overflow: hidden;
      touch-action: none;
      font-family: "Songti SC", "PingFang SC", serif;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: min(100vw, 420px);
      height: min(100vh, 780px);
      background: #070e1a;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
    }
    #badge {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(232, 226, 214, 0.45);
      font-size: 11px;
      letter-spacing: 0.08em;
      pointer-events: none;
      font-family: "PingFang SC", sans-serif;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="badge">BROWSER PREVIEW · 正式请用微信开发者工具</div>
    <canvas id="game" width="375" height="667"></canvas>
  </div>
  <script>
    (function () {
      const canvas = document.getElementById('game');
      const touchHandlers = { start: [], move: [], end: [], cancel: [] };
      const LOGICAL_W = 375;
      const LOGICAL_H = 667;

      window.wx = {
        createCanvas() { return canvas; },
        getSystemInfoSync() {
          return { windowWidth: LOGICAL_W, windowHeight: LOGICAL_H, pixelRatio: 2 };
        },
        onTouchStart(fn) { touchHandlers.start.push(fn); },
        onTouchMove(fn) { touchHandlers.move.push(fn); },
        onTouchEnd(fn) { touchHandlers.end.push(fn); },
        onTouchCancel(fn) { touchHandlers.cancel.push(fn); },
      };

      function scaleTouch(e, type) {
        const rect = canvas.getBoundingClientRect();
        const sx = LOGICAL_W / rect.width;
        const sy = LOGICAL_H / rect.height;
        const src = type === 'end' || type === 'cancel'
          ? (e.changedTouches && e.changedTouches[0]) || e
          : (e.touches && e.touches[0]) || e;
        const clientX = (('clientX' in src ? src.clientX : e.clientX) - rect.left) * sx;
        const clientY = (('clientY' in src ? src.clientY : e.clientY) - rect.top) * sy;
        return {
          touches: [{ clientX, clientY }],
          changedTouches: [{ clientX, clientY }],
        };
      }

      function bind(domType, key) {
        canvas.addEventListener(domType, (e) => {
          e.preventDefault();
          const payload = scaleTouch(e, key);
          touchHandlers[key].forEach((fn) => fn(payload));
        }, { passive: false });
      }
      bind('touchstart', 'start');
      bind('touchmove', 'move');
      bind('touchend', 'end');
      bind('touchcancel', 'cancel');

      let down = false;
      canvas.addEventListener('mousedown', (e) => {
        down = true;
        touchHandlers.start.forEach((fn) => fn(scaleTouch(e, 'start')));
      });
      window.addEventListener('mousemove', (e) => {
        if (!down) return;
        touchHandlers.move.forEach((fn) => fn(scaleTouch(e, 'move')));
      });
      window.addEventListener('mouseup', (e) => {
        if (!down) return;
        down = false;
        touchHandlers.end.forEach((fn) => fn(scaleTouch(e, 'end')));
      });
      // Some automation only dispatches click
      canvas.addEventListener('click', (e) => {
        const payload = scaleTouch(e, 'end');
        if (!down) {
          touchHandlers.start.forEach((fn) => fn(payload));
          touchHandlers.end.forEach((fn) => fn(payload));
        }
      });
    })();
  </script>
  <script>
    // CommonJS-in-browser loader (each file gets isolated scope)
    (async function boot() {
      const modules = {};

      function normalize(path) {
        return path
          .replace(/^\.\//, '')
          .replace(/^js\//, '')
          .replace(/\.js$/, '')
          .split('/')
          .pop();
      }

      function require(path) {
        const key = normalize(path);
        if (!modules[key]) throw new Error('Missing module: ' + path);
        return modules[key];
      }

      async function load(name, url) {
        const code = await fetch(url).then((r) => {
          if (!r.ok) throw new Error('Failed to load ' + url);
          return r.text();
        });
        const module = { exports: {} };
        const fn = new Function('require', 'module', 'exports', code + '\n//# sourceURL=' + url);
        fn(require, module, module.exports);
        modules[name] = module.exports;
      }

      const files = [
        ['art', 'js/art.js'],
        ['ease', 'js/ease.js'],
        ['audio', 'js/audio.js'],
        ['input', 'js/input.js'],
        ['particles', 'js/particles.js'],
        ['wind', 'js/wind.js'],
        ['levels', 'js/levels.js'],
        ['ui', 'js/ui.js'],
        ['main', 'js/main.js'],
      ];

      for (const [name, url] of files) {
        await load(name, url);
      }
      await load('game', 'game.js');
    })().catch((err) => {
      console.error(err);
      document.body.insertAdjacentHTML(
        'beforeend',
        '<pre style="color:#f5c59a;padding:16px;position:absolute;left:0;right:0;bottom:0">' +
          String(err) + '</pre>'
      );
    });
  </script>
</body>
</html>
